spring:
  datasource:
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: schema_fournisseurs

app:
  datasource:
    neon-resolver-enabled: true
    raw-url: jdbc:h2:mem:procuraflow_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:schema-test.sql'
    schema: schema_fournisseurs
  commandes:
    base-url: http://localhost:18082
    connect-timeout-ms: 500
    read-timeout-ms: 1000
